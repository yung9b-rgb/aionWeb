<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>静态数据库 · 永恒之塔 GM</title>
  <link rel="stylesheet" href="vendors/mdi/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="vendors/base/vendor.bundle.base.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="shortcut icon" href="images/favicon.png" />
</head>
<body>
  <div class="container-scroller">
    <div id="aa-navbar"></div>
    <div class="container-fluid page-body-wrapper">
      <div id="aa-sidebar"></div>
      <div class="main-panel">
        <div class="content-wrapper">
          <div class="row">
            <div class="col-md-12 grid-margin">
              <h2>静态数据库</h2>
              <p class="text-muted mb-0">查询服务端的静态数据（物品、技能、任务、NPC）。从下面的菜单选择分类。</p>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12 grid-margin">
              <ul class="aa-dbmenu" id="dbmenu"></ul>
            </div>
          </div>
          <div class="row">
            <div class="col-lg-6 grid-margin stretch-card">
              <div class="card">
                <div class="card-body">
                  <nav aria-label="breadcrumb"><ol class="breadcrumb aa-db-crumb mb-3" id="crumb"></ol></nav>
                  <div id="db-empty" class="text-muted d-none">这个模块还没开发。</div>
                  <div id="db-items">
                    <div class="aa-db-filter">
                      <div class="aa-db-frow">
                        <label>等级</label>
                        <input type="number" class="form-control form-control-sm" id="f-lv-min" min="1" max="99">
                        <span>~</span>
                        <input type="number" class="form-control form-control-sm" id="f-lv-max" min="1" max="99">
                      </div>
                      <div class="aa-db-frow">
                        <label>种族</label>
                        <button type="button" class="aa-db-race light" data-race="0" title="天族"><i class="mdi mdi-weather-sunny"></i> 天族</button>
                        <button type="button" class="aa-db-race dark" data-race="1" title="魔族"><i class="mdi mdi-weather-night"></i> 魔族</button>
                      </div>
                      <div class="aa-db-frow" id="f-quality"></div>
                      <button type="button" class="aa-db-fhead" id="f-stats-toggle" aria-expanded="false">
                        <i class="mdi mdi-chevron-down"></i> 附加属性 <span class="aa-db-fcount d-none" id="f-stats-count"></span>
                      </button>
                      <div class="aa-db-stats d-none" id="f-stats"></div>
                    </div>
                    <div class="aa-db-bar">
                      <div class="d-flex align-items-center gap-2">
                        <span>显示</span>
                        <select class="form-control form-control-sm" id="f-size" style="width:auto">
                          <option selected>10</option><option>25</option><option>50</option><option>100</option>
                        </select>
                        <span>项结果</span>
                        <button class="btn btn-sm btn-outline-secondary ms-2" id="btn-reset"><i class="mdi mdi-restore"></i> 重置筛选</button>
                      </div>
                      <div class="d-flex align-items-center gap-2">
                        <span>搜索：</span>
                        <input type="text" class="form-control form-control-sm" id="f-q" placeholder="名称或 ID" style="width:180px">
                      </div>
                    </div>
                    <div class="aa-db-bar">
                      <span class="text-muted" id="f-summary"></span>
                      <nav><ul class="pagination pagination-sm mb-0" id="f-pager"></ul></nav>
                    </div>
                    <div class="table-responsive">
                      <table class="table table-hover aa-db-table">
                        <thead id="t-head"></thead>
                        <tbody id="t-body"></tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-lg-6 grid-margin stretch-card">
              <div class="card">
                <div class="card-body aa-db-detail" id="db-detail">
                  <div class="aa-db-detail-empty"><i class="mdi mdi-information-outline"></i><div>点击左侧列表中的物品查看详情</div></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div id="aa-footer"></div>
      </div>
    </div>
  </div>
  <script src="vendors/base/vendor.bundle.base.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/off-canvas.js"></script>
  <script src="js/hoverable-collapse.js"></script>
  <script src="js/template.js"></script>
  <script>
    // Category tree. Item branch copied from Aion Codex (cn1) Items menu, minus 自定义 / 设置物 (housing) and the
    // post-2.7 weapons (chainsword, gauntlet, dimsword) and classes (thunderer, battlemaster, lumines, runeblade).
    // Each node: [key, title, children?]. The route is the key path, e.g. #item/armor/chain/chest.
    const CLASSES8 = [['fighter', '剑星'], ['knight', '守护星'], ['assassin', '杀星'], ['ranger', '弓星'], ['wizard', '魔道星'],
      ['elementalist', '精灵星'], ['priest', '治愈星'], ['chanter', '护法星']];
    const PARTS = [['chest', '上衣'], ['hands', '装甲'], ['shoulders', '护肩'], ['legs', '下衣'], ['feet', '鞋']];
    const TREE = [
      ['item', '物品', [
        ['weapon', '武器', [['sword', '长剑'], ['dagger', '短剑'], ['mace', '权杖'], ['orb', '宝珠'], ['grimoire', '法典'],
          ['2h_sword', '巨剑'], ['polearm', '战戟'], ['staff', '法杖'], ['bow', '弓']]],
        ['armor', '防具', [['cloth', '衣服', PARTS], ['robe', '布甲', PARTS], ['leather', '皮甲', PARTS], ['chain', '链甲', PARTS],
          ['plate', '金属', PARTS], ['shield', '盾牌']]],
        ['accessory', '饰品', [['headgear', '头饰'], ['earring', '耳环'], ['necklace', '项链'], ['ring', '戒指'], ['belt', '腰带']]],
        ['wing', '翅膀'],
        '-',
        ['skillrelated', '技能相关', [['stigma', '烙印', CLASSES8], ['book', '技能书', CLASSES8]]],
        ['making', '制作', [
          ['material', '材料', [['gather', '采集'], ['drop', '获得'], ['part', '部件']]],
          ['recipes', '图案', [['weaponsmith', '武器制作'], ['armorsmith', '金属盔甲制作'], ['tailoring', '裁缝'], ['handiwork', '手工'],
            ['alchemy', '炼金术'], ['cooking', '料理'], ['convert', '物质变幻'], ['order', '制作委托']]]]],
        ['consumable', '消耗品', [['food', '食品'], ['potion', '药水'], ['magical', '魔法物品'],
          ['mod', '改造', [['enchant', '强化石'], ['option', '魔石'], ['proc', '神石'], ['dye', '染色剂'], ['misc', '其他']]],
          ['misc', '其他']]],
      ]],
      ['skill', '技能', null],
      ['quest', '任务', null],
      ['npc', 'NPC', null],
    ];
    const ICONS = { item: 'mdi-sword-cross', skill: 'mdi-flash', quest: 'mdi-book-open-variant', npc: 'mdi-account-group' };

    // route string -> list of [key, title] along the path
    function resolve(route) {
      const keys = route.split('/').filter(Boolean);
      let level = TREE; const path = [];
      for (const k of keys) {
        const n = (level || []).find((x) => Array.isArray(x) && x[0] === k);
        if (!n) break;
        path.push(n); level = n[2];
      }
      return path;
    }

    function subMenu(nodes, prefix) {
      return `<ul class="aa-dbmenu-sub">${nodes.map((n) => {
        if (n === '-') return '<li class="aa-dbmenu-sep"></li>';
        const [k, title, kids] = n, r = prefix + '/' + k;
        return `<li class="${kids ? 'has-sub' : ''}"><a href="#${r}">${AA.esc(AA.t(title))}${kids ? '<i class="mdi mdi-chevron-right"></i>' : ''}</a>${kids ? subMenu(kids, r) : ''}</li>`;
      }).join('')}</ul>`;
    }

    document.getElementById('dbmenu').innerHTML = TREE.map(([k, title, kids]) => `
      <li class="aa-dbmenu-top${kids ? '' : ' aa-dbmenu-empty'}" data-top="${k}">
        <a href="#${k}"><i class="mdi ${ICONS[k]}"></i> ${AA.esc(AA.t(title))}${kids ? ' <i class="mdi mdi-chevron-down"></i>' : ''}</a>
        ${kids ? subMenu(kids, k) : ''}
      </li>`).join('');

    // close the open flyout after a click so the page underneath is visible
    document.getElementById('dbmenu').addEventListener('click', (e) => {
      if (!e.target.closest('a')) return;
      const m = document.getElementById('dbmenu');
      m.classList.add('aa-dbmenu-closed');
      setTimeout(() => m.classList.remove('aa-dbmenu-closed'), 300);
    });

    // Item list: filters -> /api/db/items (server-side filter + paging). 附加属性 tags come from the category's items.
    const QUALITIES = [['common', '普通'], ['rare', '稀有'], ['legend', '传颂'], ['unique', '唯一'], ['epic', '英雄']];
    const state = { cat: '', page: 1, races: new Set(), qualities: new Set(), stats: new Set(), statList: [], seq: 0, selected: 0,
      sort: 'id', desc: false };

    document.getElementById('f-quality').innerHTML = `<label>${AA.t('品质')}</label>` + QUALITIES.map(([k, t]) =>
      `<label class="aa-db-q aa-quality-${k}"><input type="checkbox" value="${k}"> ${AA.t(t)}</label>`).join('');
    // ID and 等级 sort server-side; clicking the active column again reverses it
    function renderHead() {
      const th = (key, label, width) => {
        const on = state.sort === key;
        const icon = on ? (state.desc ? 'mdi-arrow-down' : 'mdi-arrow-up') : 'mdi-swap-vertical';
        return `<th style="width:${width}px" class="aa-db-sort${on ? ' on' : ''}" data-sort="${key}">${label} <i class="mdi ${icon}"></i></th>`;
      };
      document.getElementById('t-head').innerHTML = `<tr>${th('id', 'ID', 110)}<th style="width:52px"></th>
        <th>${AA.t('物品名称')}</th>${th('lv', AA.t('等级'), 80)}</tr>`;
    }
    renderHead();
    document.getElementById('t-head').addEventListener('click', (e) => {
      const th = e.target.closest('[data-sort]'); if (!th) return;
      if (state.sort === th.dataset.sort) state.desc = !state.desc;
      else { state.sort = th.dataset.sort; state.desc = false; }
      renderHead(); reload();
    });

    const nameOf = (r) => (AA.lang === 'en' ? (r.en || r.k) : (r.zh || r.k));
    const val = (id) => document.getElementById(id).value.trim();

    function renderStats() {
      document.getElementById('f-stats').innerHTML = state.statList.length
        ? state.statList.map((s) => `<button type="button" data-stat="${AA.esc(s.key)}" class="${state.stats.has(s.key) ? 'on' : ''}" title="${s.n}">${AA.esc(AA.t(s.label))}</button>`).join('')
        : `<span class="text-muted small">${AA.t('这个分类没有附加属性')}</span>`;
      statsCount();
    }

    function renderPager(page, pages) {
      const nums = [];
      for (let n = Math.max(1, page - 2); n <= Math.min(pages, page + 2); n++) nums.push(n);
      const li = (n, label, dis, act) => `<li class="page-item${dis ? ' disabled' : ''}${act ? ' active' : ''}"><a class="page-link" href="#" data-page="${n}">${label}</a></li>`;
      document.getElementById('f-pager').innerHTML = li(page - 1, AA.t('上一页'), page <= 1)
        + (nums[0] > 1 ? li(1, '1') + (nums[0] > 2 ? li(0, '…', true) : '') : '')
        + nums.map((n) => li(n, n, false, n === page)).join('')
        + (nums[nums.length - 1] < pages ? (nums[nums.length - 1] < pages - 1 ? li(0, '…', true) : '') + li(pages, pages) : '')
        + li(page + 1, AA.t('下一页'), page >= pages);
    }

    async function load() {
      const q = new URLSearchParams({ cat: state.cat, page: state.page, size: val('f-size'), sort: state.sort, dir: state.desc ? 'desc' : 'asc' });
      if (val('f-lv-min')) q.set('lvMin', val('f-lv-min'));
      if (val('f-lv-max')) q.set('lvMax', val('f-lv-max'));
      if (state.races.size) q.set('race', [...state.races].join(','));
      if (state.qualities.size) q.set('q', [...state.qualities].join(','));
      if (state.stats.size) q.set('stats', [...state.stats].join(','));
      if (val('f-q')) q.set('search', val('f-q'));
      const seq = ++state.seq;
      const body = document.getElementById('t-body');
      let d;
      try { d = await AA.api('GET', '/api/db/items?' + q); } catch (e) {
        if (seq === state.seq) body.innerHTML = `<tr><td colspan="4" class="text-danger text-center py-4">${AA.esc(e.message)}</td></tr>`;
        return;
      }
      if (seq !== state.seq) return;          // a newer request is on its way
      state.page = d.page;
      state.statList = d.stats;
      for (const k of [...state.stats]) if (!d.stats.some((s) => s.key === k)) state.stats.delete(k);
      renderStats();
      body.innerHTML = d.rows.map((r) => `
        <tr data-id="${r.id}" class="aa-db-row${r.id === state.selected ? ' table-active' : ''}">
          <td class="aa-mono">${r.id}</td>
          <td><span class="aa-db-icon aa-db-icon-${AA.esc(r.q)}">${r.ic ? `<img src="icons/item/${encodeURIComponent(r.ic)}.png" alt="" loading="lazy" onerror="this.remove()">` : ''}</span></td>
          <td class="aa-quality-${AA.esc(r.q)}" data-no-i18n>${AA.esc(nameOf(r))}</td>
          <td>${r.lv}</td>
        </tr>`).join('') || `<tr><td colspan="4" class="text-muted text-center py-4">${AA.t('没有符合条件的物品')}</td></tr>`;
      const from = d.total ? (d.page - 1) * d.size + 1 : 0, to = Math.min(d.total, d.page * d.size);
      document.getElementById('f-summary').textContent = AA.t('第 {0} 至 {1} 项，共 {2} 项', from, to, AA.fmtNum(d.total));
      renderPager(d.page, d.pages);
    }

    let timer = 0;
    const reload = (delay = 0) => { state.page = 1; clearTimeout(timer); timer = setTimeout(load, delay); };

    function renderItems(route) {
      const cat = route.replace(/^item\/?/, '');
      if (cat !== state.cat) { state.cat = cat; state.selected = 0; }
      reload();
    }

    const toggle = (set, v) => { set.has(v) ? set.delete(v) : set.add(v); };
    document.querySelectorAll('.aa-db-race').forEach((b) => b.addEventListener('click', () => {
      b.classList.toggle('on'); toggle(state.races, b.dataset.race); reload();
    }));
    document.getElementById('f-quality').addEventListener('change', (e) => { toggle(state.qualities, e.target.value); reload(); });
    document.getElementById('f-stats').addEventListener('click', (e) => {
      const b = e.target.closest('[data-stat]'); if (!b) return;
      b.classList.toggle('on'); toggle(state.stats, b.dataset.stat);
      statsCount(); reload();
    });
    ['f-lv-min', 'f-lv-max', 'f-q'].forEach((id) => document.getElementById(id).addEventListener('input', () => reload(350)));
    document.getElementById('f-size').addEventListener('change', () => reload());
    document.getElementById('f-pager').addEventListener('click', (e) => {
      const a = e.target.closest('[data-page]'); if (!a) return;
      e.preventDefault();
      const n = +a.dataset.page;
      if (!n || a.parentElement.classList.contains('disabled') || a.parentElement.classList.contains('active')) return;
      state.page = n; load();
    });
    // row click selects the item; the detail card on the right will show it (to be built)
    document.getElementById('t-body').addEventListener('click', (e) => {
      const tr = e.target.closest('tr[data-id]'); if (!tr) return;
      state.selected = +tr.dataset.id;
      document.querySelectorAll('#t-body tr.table-active').forEach((x) => x.classList.remove('table-active'));
      tr.classList.add('table-active');
    });
    // 附加属性 is collapsed by default; the header shows how many are selected
    function statsCount() {
      const c = document.getElementById('f-stats-count');
      c.textContent = AA.t('已选 {0}', state.stats.size);
      c.classList.toggle('d-none', state.stats.size === 0);
    }
    document.getElementById('f-stats-toggle').addEventListener('click', (e) => {
      const btn = e.currentTarget, open = btn.getAttribute('aria-expanded') !== 'true';
      btn.setAttribute('aria-expanded', String(open));
      document.getElementById('f-stats').classList.toggle('d-none', !open);
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
      ['f-lv-min', 'f-lv-max', 'f-q'].forEach((id) => { document.getElementById(id).value = ''; });
      document.querySelectorAll('#db-items .on').forEach((x) => x.classList.remove('on'));
      document.querySelectorAll('#f-quality input').forEach((x) => { x.checked = false; });
      state.races.clear(); state.qualities.clear(); state.stats.clear();
      statsCount(); reload();
    });

    function render() {
      const route = decodeURIComponent(location.hash.slice(1)) || 'item';
      const path = resolve(route);
      document.querySelectorAll('.aa-dbmenu-top').forEach((li) => li.classList.toggle('active', path[0] && li.dataset.top === path[0][0]));
      let acc = '';
      document.getElementById('crumb').innerHTML = path.map(([k, title], i) => {
        acc += (acc ? '/' : '') + k;
        return i === path.length - 1
          ? `<li class="breadcrumb-item active">${AA.esc(AA.t(title))}</li>`
          : `<li class="breadcrumb-item"><a href="#${acc}">${AA.esc(AA.t(title))}</a></li>`;
      }).join('');
      const isItem = path[0] && path[0][0] === 'item';
      document.getElementById('db-items').classList.toggle('d-none', !isItem);
      document.getElementById('db-empty').classList.toggle('d-none', isItem);
      if (isItem) {
        renderItems(path.map((n) => n[0]).join('/'));
        showStats(!NON_GEAR.includes(path[1] && path[1][0]));
      }
    }
    // 技能相关 / 制作 / 消耗品 are ordinary items, not gear: no 附加属性 filter there
    const NON_GEAR = ['skillrelated', 'making', 'consumable'];
    const showStats = (on) => ['f-stats-toggle', 'f-stats'].forEach((id) => { document.getElementById(id).style.display = on ? '' : 'none'; });
    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>

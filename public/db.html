<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>静态数据库 · 永恒之塔 GM</title>
  <link rel="stylesheet" href="vendors/mdi/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="vendors/base/vendor.bundle.base.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="shortcut icon" href="images/favicon.png" />
</head>
<body>
  <div class="container-scroller">
    <div id="aa-navbar"></div>
    <div class="container-fluid page-body-wrapper">
      <div id="aa-sidebar"></div>
      <div class="main-panel">
        <div class="content-wrapper">
          <div class="row">
            <div class="col-md-12 grid-margin">
              <h2>静态数据库</h2>
              <p class="text-muted mb-0">查询服务端的静态数据（物品、技能、任务、NPC）。从下面的菜单选择分类。</p>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12 grid-margin">
              <ul class="aa-dbmenu" id="dbmenu"></ul>
            </div>
          </div>
          <div class="row">
            <div class="col-lg-6 grid-margin stretch-card">
              <div class="card">
                <div class="card-body">
                  <nav aria-label="breadcrumb"><ol class="breadcrumb aa-db-crumb mb-3" id="crumb"></ol></nav>
                  <div id="db-empty" class="text-muted d-none">这个模块还没开发。</div>
                  <div id="db-groups" class="d-none">
                    <p class="text-muted small">服务端通用掉落组（CommonDropItems.xml）。怪物击杀时，每个引用的组掷一次，最多出组里的一件。</p>
                    <div class="aa-db-bar">
                      <div class="d-flex align-items-center gap-2">
                        <span>显示</span>
                        <select class="form-control form-control-sm" id="g-size" style="width:auto">
                          <option selected>10</option><option>25</option><option>50</option><option>100</option>
                        </select>
                        <span>项结果</span>
                      </div>
                      <div class="d-flex align-items-center gap-2">
                        <span>搜索：</span>
                        <input type="text" class="form-control form-control-sm" id="g-q" placeholder="组名、ID 或掉落物名称" style="width:200px">
                      </div>
                    </div>
                    <div class="aa-db-bar">
                      <span class="text-muted" id="g-summary"></span>
                      <nav><ul class="pagination pagination-sm mb-0" id="g-pager"></ul></nav>
                    </div>
                    <div class="table-responsive">
                      <table class="table table-hover aa-db-table">
                        <thead id="g-head"></thead>
                        <tbody id="g-body"></tbody>
                      </table>
                    </div>
                  </div>
                  <div id="db-npcs" class="d-none">
                    <div class="aa-db-filter">
                      <div class="aa-db-frow">
                        <label>等级</label>
                        <input type="number" class="form-control form-control-sm" id="n-lv-min" min="1" max="99">
                        <span>~</span>
                        <input type="number" class="form-control form-control-sm" id="n-lv-max" min="1" max="99">
                      </div>
                      <div class="aa-db-frow" id="n-grade"></div>
                      <div class="aa-db-frow aa-db-region" id="n-region"></div>
                    </div>
                    <div class="aa-db-bar">
                      <div class="d-flex align-items-center gap-2">
                        <span>显示</span>
                        <select class="form-control form-control-sm" id="n-size" style="width:auto">
                          <option selected>10</option><option>25</option><option>50</option><option>100</option>
                        </select>
                        <span>项结果</span>
                        <button class="btn btn-sm btn-outline-secondary ms-2" id="n-reset"><i class="mdi mdi-restore"></i> 重置筛选</button>
                      </div>
                      <div class="d-flex align-items-center gap-2">
                        <span>搜索：</span>
                        <input type="text" class="form-control form-control-sm" id="n-q" placeholder="名称、称号或 ID" style="width:180px">
                      </div>
                    </div>
                    <div class="aa-db-bar">
                      <span class="text-muted" id="n-summary"></span>
                      <nav><ul class="pagination pagination-sm mb-0" id="n-pager"></ul></nav>
                    </div>
                    <div class="table-responsive">
                      <table class="table table-hover aa-db-table">
                        <thead id="n-head"></thead>
                        <tbody id="n-body"></tbody>
                      </table>
                    </div>
                  </div>
                  <div id="db-items">
                    <div class="aa-db-filter">
                      <div class="aa-db-frow">
                        <label>等级</label>
                        <input type="number" class="form-control form-control-sm" id="f-lv-min" min="1" max="99">
                        <span>~</span>
                        <input type="number" class="form-control form-control-sm" id="f-lv-max" min="1" max="99">
                      </div>
                      <div class="aa-db-frow">
                        <label>种族</label>
                        <button type="button" class="aa-db-race light" data-race="0" title="天族"><i class="mdi mdi-weather-sunny"></i> 天族</button>
                        <button type="button" class="aa-db-race dark" data-race="1" title="魔族"><i class="mdi mdi-weather-night"></i> 魔族</button>
                      </div>
                      <div class="aa-db-frow" id="f-quality"></div>
                      <button type="button" class="aa-db-fhead" id="f-stats-toggle" aria-expanded="false">
                        <i class="mdi mdi-chevron-down"></i> 附加属性 <span class="aa-db-fcount d-none" id="f-stats-count"></span>
                      </button>
                      <div class="aa-db-stats d-none" id="f-stats"></div>
                    </div>
                    <div class="aa-db-bar">
                      <div class="d-flex align-items-center gap-2">
                        <span>显示</span>
                        <select class="form-control form-control-sm" id="f-size" style="width:auto">
                          <option selected>10</option><option>25</option><option>50</option><option>100</option>
                        </select>
                        <span>项结果</span>
                        <button class="btn btn-sm btn-outline-secondary ms-2" id="btn-reset"><i class="mdi mdi-restore"></i> 重置筛选</button>
                      </div>
                      <div class="d-flex align-items-center gap-2">
                        <span>搜索：</span>
                        <input type="text" class="form-control form-control-sm" id="f-q" placeholder="名称或 ID" style="width:180px">
                      </div>
                    </div>
                    <div class="aa-db-bar">
                      <span class="text-muted" id="f-summary"></span>
                      <nav><ul class="pagination pagination-sm mb-0" id="f-pager"></ul></nav>
                    </div>
                    <div class="table-responsive">
                      <table class="table table-hover aa-db-table">
                        <thead id="t-head"></thead>
                        <tbody id="t-body"></tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-lg-6 grid-margin stretch-card">
              <div class="card">
                <div class="card-body aa-db-detail" id="db-detail">
                  <div class="aa-db-detail-empty"><i class="mdi mdi-information-outline"></i><div>点击左侧列表中的物品查看详情</div></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div id="aa-footer"></div>
      </div>
    </div>
  </div>
  <script src="vendors/base/vendor.bundle.base.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/off-canvas.js"></script>
  <script src="js/hoverable-collapse.js"></script>
  <script src="js/template.js"></script>
  <script>
    // Category tree. Item branch copied from Aion Codex (cn1) Items menu, minus 自定义 / 设置物 (housing) and the
    // post-2.7 weapons (chainsword, gauntlet, dimsword) and classes (thunderer, battlemaster, lumines, runeblade).
    // Each node: [key, title, children?]. The route is the key path, e.g. #item/armor/chain/chest.
    const CLASSES8 = [['fighter', '剑星'], ['knight', '守护星'], ['assassin', '杀星'], ['ranger', '弓星'], ['wizard', '魔道星'],
      ['elementalist', '精灵星'], ['priest', '治愈星'], ['chanter', '护法星']];
    const PARTS = [['chest', '上衣'], ['hands', '装甲'], ['shoulders', '护肩'], ['legs', '下衣'], ['feet', '鞋']];
    const TREE = [
      ['item', '物品', [
        ['weapon', '武器', [['sword', '长剑'], ['dagger', '短剑'], ['mace', '权杖'], ['orb', '宝珠'], ['grimoire', '法典'],
          ['2h_sword', '巨剑'], ['polearm', '战戟'], ['staff', '法杖'], ['bow', '弓']]],
        ['armor', '防具', [['cloth', '衣服', PARTS], ['robe', '布甲', PARTS], ['leather', '皮甲', PARTS], ['chain', '链甲', PARTS],
          ['plate', '金属', PARTS], ['shield', '盾牌']]],
        ['accessory', '饰品', [['headgear', '头饰'], ['earring', '耳环'], ['necklace', '项链'], ['ring', '戒指'], ['belt', '腰带']]],
        ['wing', '翅膀'],
        '-',
        ['skillrelated', '技能相关', [['stigma', '烙印', CLASSES8], ['book', '技能书', CLASSES8]]],
        ['making', '制作', [
          ['material', '材料', [['gather', '采集'], ['drop', '获得'], ['part', '部件']]],
          ['recipes', '图案', [['weaponsmith', '武器制作'], ['armorsmith', '金属盔甲制作'], ['tailoring', '裁缝'], ['handiwork', '手工'],
            ['alchemy', '炼金术'], ['cooking', '料理'], ['convert', '物质变幻'], ['order', '制作委托']]]]],
        ['consumable', '消耗品', [['food', '食品'], ['potion', '药水'], ['magical', '魔法物品'],
          ['mod', '改造', [['enchant', '强化石'], ['option', '魔石'], ['proc', '神石'], ['dye', '染色剂'], ['misc', '其他']]],
          ['misc', '其他']]],
        '-',
        ['dropgroup', '掉落组'],
      ]],
      ['skill', '技能', null],
      ['quest', '任务', null],
      // 副本: one entry per instance, filled from /api/db/npcs/instances; shown as a grid (there are ~50)
      ['npc', 'NPC', [['light', '天族'], ['dark', '魔族'], ['monster', '怪物'], ['chief', '头目'], ['boss', '命名BOSS'], '-',
        ['instance', '副本', [], 'grid']]],
    ];
    const ICONS = { item: 'mdi-sword-cross', skill: 'mdi-flash', quest: 'mdi-book-open-variant', npc: 'mdi-account-group' };

    // route string -> list of [key, title] along the path
    function resolve(route) {
      const keys = route.split('/').filter(Boolean);
      let level = TREE; const path = [];
      for (const k of keys) {
        const n = (level || []).find((x) => Array.isArray(x) && x[0] === k);
        if (!n) break;
        path.push(n); level = n[2];
      }
      return path;
    }

    function subMenu(nodes, prefix, grid) {
      return `<ul class="aa-dbmenu-sub${grid ? ' aa-dbmenu-grid' : ''}">${nodes.map((n) => {
        if (n === '-') return '<li class="aa-dbmenu-sep"></li>';
        const [k, title, kids, kind] = n, r = prefix + '/' + k;
        return `<li class="${kids ? 'has-sub' : ''}"><a href="#${r}">${AA.esc(AA.t(title))}${kids ? '<i class="mdi mdi-chevron-right"></i>' : ''}</a>${kids && kids.length ? subMenu(kids, r, kind === 'grid') : ''}</li>`;
      }).join('')}</ul>`;
    }

    function buildMenu() {
      document.getElementById('dbmenu').innerHTML = TREE.map(([k, title, kids]) => `
        <li class="aa-dbmenu-top${kids ? '' : ' aa-dbmenu-empty'}" data-top="${k}">
          <a href="#${k}"><i class="mdi ${ICONS[k]}"></i> ${AA.esc(AA.t(title))}${kids ? ' <i class="mdi mdi-chevron-down"></i>' : ''}</a>
          ${kids ? subMenu(kids, k) : ''}
        </li>`).join('');
    }
    buildMenu();

    // close the open flyout after a click so the page underneath is visible
    document.getElementById('dbmenu').addEventListener('click', (e) => {
      if (!e.target.closest('a')) return;
      const m = document.getElementById('dbmenu');
      m.classList.add('aa-dbmenu-closed');
      setTimeout(() => m.classList.remove('aa-dbmenu-closed'), 300);
    });

    // Item list: filters -> /api/db/items (server-side filter + paging). 附加属性 tags come from the category's items.
    const QUALITIES = [['common', '普通'], ['rare', '稀有'], ['legend', '传颂'], ['unique', '唯一'], ['epic', '英雄']];
    const state = { cat: '', page: 1, races: new Set(), qualities: new Set(), stats: new Set(), statList: [], seq: 0, selected: 0,
      sort: 'id', desc: false };

    document.getElementById('f-quality').innerHTML = `<label>${AA.t('品质')}</label>` + QUALITIES.map(([k, t]) =>
      `<label class="aa-db-q aa-quality-${k}"><input type="checkbox" value="${k}"> ${AA.t(t)}</label>`).join('');
    // ID and 等级 sort server-side; clicking the active column again reverses it
    function renderHead() {
      const th = (key, label, width) => {
        const on = state.sort === key;
        const icon = on ? (state.desc ? 'mdi-arrow-down' : 'mdi-arrow-up') : 'mdi-swap-vertical';
        return `<th style="width:${width}px" class="aa-db-sort${on ? ' on' : ''}" data-sort="${key}">${label} <i class="mdi ${icon}"></i></th>`;
      };
      document.getElementById('t-head').innerHTML = `<tr>${th('id', 'ID', 110)}<th style="width:52px"></th>
        <th>${AA.t('物品名称')}</th>${th('lv', AA.t('等级'), 80)}</tr>`;
    }
    renderHead();
    document.getElementById('t-head').addEventListener('click', (e) => {
      const th = e.target.closest('[data-sort]'); if (!th) return;
      if (state.sort === th.dataset.sort) state.desc = !state.desc;
      else { state.sort = th.dataset.sort; state.desc = false; }
      renderHead(); reload();
    });

    const nameOf = (r) => (AA.lang === 'en' ? (r.en || r.k) : (r.zh || r.k));
    const val = (id) => document.getElementById(id).value.trim();

    function renderStats() {
      document.getElementById('f-stats').innerHTML = state.statList.length
        ? state.statList.map((s) => `<button type="button" data-stat="${AA.esc(s.key)}" class="${state.stats.has(s.key) ? 'on' : ''}" title="${s.n}">${AA.esc(AA.t(s.label))}</button>`).join('')
        : `<span class="text-muted small">${AA.t('这个分类没有附加属性')}</span>`;
      statsCount();
    }

    function renderPager(page, pages, id = 'f-pager') {
      const nums = [];
      for (let n = Math.max(1, page - 2); n <= Math.min(pages, page + 2); n++) nums.push(n);
      const li = (n, label, dis, act) => `<li class="page-item${dis ? ' disabled' : ''}${act ? ' active' : ''}"><a class="page-link" href="#" data-page="${n}">${label}</a></li>`;
      document.getElementById(id).innerHTML = li(page - 1, AA.t('上一页'), page <= 1)
        + (nums[0] > 1 ? li(1, '1') + (nums[0] > 2 ? li(0, '…', true) : '') : '')
        + nums.map((n) => li(n, n, false, n === page)).join('')
        + (nums[nums.length - 1] < pages ? (nums[nums.length - 1] < pages - 1 ? li(0, '…', true) : '') + li(pages, pages) : '')
        + li(page + 1, AA.t('下一页'), page >= pages);
    }

    async function load() {
      const q = new URLSearchParams({ cat: state.cat, page: state.page, size: val('f-size'), sort: state.sort, dir: state.desc ? 'desc' : 'asc' });
      if (val('f-lv-min')) q.set('lvMin', val('f-lv-min'));
      if (val('f-lv-max')) q.set('lvMax', val('f-lv-max'));
      if (state.races.size) q.set('race', [...state.races].join(','));
      if (state.qualities.size) q.set('q', [...state.qualities].join(','));
      if (state.stats.size) q.set('stats', [...state.stats].join(','));
      if (val('f-q')) q.set('search', val('f-q'));
      const seq = ++state.seq;
      const body = document.getElementById('t-body');
      let d;
      try { d = await AA.api('GET', '/api/db/items?' + q); } catch (e) {
        if (seq === state.seq) body.innerHTML = `<tr><td colspan="4" class="text-danger text-center py-4">${AA.esc(e.message)}</td></tr>`;
        return;
      }
      if (seq !== state.seq) return;          // a newer request is on its way
      state.page = d.page;
      state.statList = d.stats;
      for (const k of [...state.stats]) if (!d.stats.some((s) => s.key === k)) state.stats.delete(k);
      renderStats();
      body.innerHTML = d.rows.map((r) => `
        <tr data-id="${r.id}" class="aa-db-row${r.id === state.selected ? ' table-active' : ''}">
          <td class="aa-mono">${r.id}</td>
          <td><span class="aa-db-icon aa-db-icon-${AA.esc(r.q)}">${r.ic ? `<img src="icons/item/${encodeURIComponent(r.ic)}.png" alt="" loading="lazy" onerror="this.remove()">` : ''}</span></td>
          <td class="aa-quality-${AA.esc(r.q)}" data-no-i18n>${AA.esc(nameOf(r))}</td>
          <td>${r.lv}</td>
        </tr>`).join('') || `<tr><td colspan="4" class="text-muted text-center py-4">${AA.t('没有符合条件的物品')}</td></tr>`;
      const from = d.total ? (d.page - 1) * d.size + 1 : 0, to = Math.min(d.total, d.page * d.size);
      document.getElementById('f-summary').textContent = AA.t('第 {0} 至 {1} 项，共 {2} 项', from, to, AA.fmtNum(d.total));
      renderPager(d.page, d.pages);
    }

    let timer = 0;
    const reload = (delay = 0) => { state.page = 1; clearTimeout(timer); timer = setTimeout(load, delay); };

    function renderItems(route) {
      const cat = route.replace(/^item\/?/, '');
      if (cat !== state.cat) {
        state.cat = cat; state.selected = 0; ist.it = null;
        document.getElementById('db-detail').innerHTML = DETAIL_EMPTY;
      }
      reload();
    }

    const toggle = (set, v) => { set.has(v) ? set.delete(v) : set.add(v); };
    document.querySelectorAll('.aa-db-race').forEach((b) => b.addEventListener('click', () => {
      b.classList.toggle('on'); toggle(state.races, b.dataset.race); reload();
    }));
    document.getElementById('f-quality').addEventListener('change', (e) => { toggle(state.qualities, e.target.value); reload(); });
    document.getElementById('f-stats').addEventListener('click', (e) => {
      const b = e.target.closest('[data-stat]'); if (!b) return;
      b.classList.toggle('on'); toggle(state.stats, b.dataset.stat);
      statsCount(); reload();
    });
    ['f-lv-min', 'f-lv-max', 'f-q'].forEach((id) => document.getElementById(id).addEventListener('input', () => reload(350)));
    document.getElementById('f-size').addEventListener('change', () => reload());
    document.getElementById('f-pager').addEventListener('click', (e) => {
      const a = e.target.closest('[data-page]'); if (!a) return;
      e.preventDefault();
      const n = +a.dataset.page;
      if (!n || a.parentElement.classList.contains('disabled') || a.parentElement.classList.contains('active')) return;
      state.page = n; load();
    });
    // row click selects the item and shows it in the detail card on the right
    document.getElementById('t-body').addEventListener('click', (e) => {
      const tr = e.target.closest('tr[data-id]'); if (!tr) return;
      state.selected = +tr.dataset.id;
      document.querySelectorAll('#t-body tr.table-active').forEach((x) => x.classList.remove('table-active'));
      tr.classList.add('table-active');
      showItem(state.selected);
    });
    // 附加属性 is collapsed by default; the header shows how many are selected
    function statsCount() {
      const c = document.getElementById('f-stats-count');
      c.textContent = AA.t('已选 {0}', state.stats.size);
      c.classList.toggle('d-none', state.stats.size === 0);
    }
    document.getElementById('f-stats-toggle').addEventListener('click', (e) => {
      const btn = e.currentTarget, open = btn.getAttribute('aria-expanded') !== 'true';
      btn.setAttribute('aria-expanded', String(open));
      document.getElementById('f-stats').classList.toggle('d-none', !open);
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
      ['f-lv-min', 'f-lv-max', 'f-q'].forEach((id) => { document.getElementById(id).value = ''; });
      document.querySelectorAll('#db-items .on').forEach((x) => x.classList.remove('on'));
      document.querySelectorAll('#f-quality input').forEach((x) => { x.checked = false; });
      state.races.clear(); state.qualities.clear(); state.stats.clear();
      statsCount(); reload();
    });

    // ---- 物品详情: /api/db/items/:id -> tooltip-style 属性 tab + 原始数据 tab (every items.xml field) ----
    const ist = { it: null, tab: 'groups', seq: 0, gpage: 1 };
    const yes = (v) => v !== undefined && /^(true|1)$/i.test(String(v).trim());
    const num = (v) => Number(v ?? 0) || 0;
    const RACE_NAME = ['天族', '魔族', '通用'];
    const GENDER = { all: '通用', male: '仅男性', female: '仅女性' };
    // type line from the menu routes; items filed under several classes (stigma, skill books) show the common part
    function typeOf(it) {
      if (!it.c || !it.c.length) return '';
      let parts = it.c[0].split('/');
      for (const c of it.c.slice(1)) { const o = c.split('/'); let n = 0; while (n < parts.length && parts[n] === o[n]) n++; parts = parts.slice(0, n); }
      return resolve('item/' + parts.join('/')).slice(1).map((n) => AA.t(n[1])).join(' · ');
    }
    // minutes -> 14 天 / 3 小时 / 30 分钟
    const minutes = (m) => (m >= 1440 && m % 1440 < 60 ? Math.floor(m / 1440) + ' ' + AA.t('天') : m >= 60 && m % 60 === 0 ? m / 60 + ' ' + AA.t('小时') : AA.fmtNum(m) + ' ' + AA.t('分钟'));
    const iconBox = (q, ic, big) => `<span class="aa-db-icon aa-db-icon-${AA.esc(q)}${big ? ' aa-db-icon-lg' : ''}">${ic ? `<img src="icons/item/${encodeURIComponent(ic)}.png" alt="" onerror="this.remove()">` : ''}</span>`;
    const refName = (r) => (r.id ? `<span class="aa-quality-${AA.esc(r.q)}" data-no-i18n>${AA.esc(nameOf(r))}</span>` : `<span class="aa-mono">${AA.esc(r.k)}</span>`);
    const kv = (rows) => rows.filter(Boolean).map(([k, v, cls]) => `<div class="aa-tip-kv${cls ? ' ' + cls : ''}"><span>${AA.t(k)}</span><b>${v}</b></div>`).join('');
    // stats sit in two columns, like the in-game tooltip
    const grid = (body) => (body ? `<div class="aa-tip-grid">${body}</div>` : '');
    const sec = (title, body) => (body ? `<div class="aa-tip-sec">${title ? `<div class="aa-tip-title">${AA.t(title)}</div>` : ''}${body}</div>` : '');

    async function showItem(id) {
      const box = document.getElementById('db-detail');
      const seq = ++ist.seq;
      let it;
      try { it = await AA.api('GET', '/api/db/items/' + id); } catch (e) {
        if (seq === ist.seq) box.innerHTML = `<div class="text-danger">${AA.esc(e.message)}</div>`;
        return;
      }
      if (seq !== ist.seq || state.selected !== id || pageKind !== 'item') return;
      ist.it = it; ist.gpage = 1;
      // the tooltip is the main view; beside it 附加信息 and the chat link, below it the 掉落组 / 原始数据 tabs
      const link = `[item: ${it.id}]`;
      box.innerHTML = `
        <div class="aa-item-top">
          ${itemInfo(it)}
          <div class="aa-item-side">
            <div class="aa-side-box">
              <div class="aa-side-title">${AA.t('附加信息')}</div>
              <div class="aa-side-kv"><span>${AA.t('最大堆放数')}</span><b>${AA.fmtNum(Math.max(1, num(it.f.max_stack_count)))}</b></div>
            </div>
            <div class="aa-side-box">
              <div class="aa-side-title">${AA.t('游戏视窗用超连结')}</div>
              <div class="input-group input-group-sm">
                <input type="text" class="form-control aa-mono" id="it-link" value="${AA.esc(link)}" readonly>
                <button type="button" class="btn btn-primary" id="it-copy">${AA.t('复制')}</button>
              </div>
            </div>
          </div>
        </div>
        <ul class="nav nav-tabs aa-db-tabs mt-4 mb-3">
          <li class="nav-item"><a class="nav-link" href="#" data-itab="groups">${AA.t('掉落组')} <span class="badge bg-light text-dark">${it.groups ? it.groups.length : '-'}</span></a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-itab="raw">${AA.t('原始数据')} <span class="badge bg-light text-dark">${Object.keys(it.f).length}</span></a></li>
        </ul>
        <div id="it-body"></div>`;
      renderItemTab();
    }

    function renderItemTab() {
      const it = ist.it; if (!it) return;
      document.querySelectorAll('#db-detail [data-itab]').forEach((a) => a.classList.toggle('active', a.dataset.itab === ist.tab));
      document.getElementById('it-body').innerHTML = ist.tab === 'raw' ? itemRaw(it) : itemGroupsTab(it);
      if (ist.tab === 'groups' && it.groups && it.groups.length > IG_SIZE) {
        renderPager(ist.gpage, Math.ceil(it.groups.length / IG_SIZE), 'ig-pager');
      }
    }

    // 掉落组 tab: the CommonDropItems groups holding this item; a click opens the group on the 掉落组 page
    const IG_SIZE = 10;
    function itemGroupsTab(it) {
      if (!it.groups) return `<p class="text-muted">${AA.t('没有掉落组数据：先用 tools/build_db_dropgroups.py 生成（见 README）')}</p>`;
      if (!it.groups.length) return `<p class="text-muted">${AA.t('没有掉落组包含这件物品。')}</p>`;
      const pages = Math.ceil(it.groups.length / IG_SIZE);
      const page = ist.gpage = Math.min(Math.max(ist.gpage, 1), pages);
      const view = it.groups.slice((page - 1) * IG_SIZE, page * IG_SIZE);
      return `<div class="table-responsive"><table class="table table-sm aa-db-table">
        <thead><tr><th style="width:80px">ID</th><th>${AA.t('掉落组')}</th>
          <th style="width:86px" title="${AA.t('掉落系数 100 时，每掷一次出这件的概率')}">${AA.t('每次概率')}</th>
          <th style="width:76px">${AA.t('组内占比')}</th>
          <th style="width:76px">${AA.t('引用 NPC')}</th>
          <th style="width:96px" title="${AA.t('引用这个组的怪物里，掉落系数最高的那只击杀一次出这件的概率')}">${AA.t('最高概率')}</th></tr></thead>
        <tbody>${view.map((g) => `
          <tr class="aa-db-row" data-gopen="${g.id}">
            <td class="aa-mono">${g.id}</td><td class="aa-mono" data-no-i18n>${AA.esc(g.name)}</td>
            <td class="aa-mono">${pct(g.weight)}</td>
            <td class="aa-mono">${g.total ? (g.weight / g.total * 100).toFixed(1) + '%' : ''}</td>
            <td>${AA.fmtNum(g.users)}</td><td class="aa-mono">${g.users ? pct(g.best) : '-'}</td>
          </tr>`).join('')}</tbody></table></div>
        ${pages > 1 ? `<nav class="d-flex justify-content-end"><ul class="pagination pagination-sm mb-2" id="ig-pager"></ul></nav>` : ''}
        <p class="text-muted small mb-0">${AA.t('点一行打开这个掉落组。每次概率按掉落系数 100 计算；一个组每次击杀最多出一件。')}</p>`;
    }

    function itemInfo(it) {
      const f = it.f, q = QUALITIES.find(([k]) => k === it.q);
      // base stats by kind: weapon / shield / armor
      let base = '';
      if (f.weapon_type) {
        base = kv([
          ['攻击力', `${num(f.min_damage)} - ${num(f.max_damage)}`],
          ['攻击速度', (num(f.attack_delay) / 1000).toFixed(1)],
          num(f.hit_accuracy) && ['命中', num(f.hit_accuracy)],
          num(f.critical) && ['物理致命一击', num(f.critical)],
          num(f.parry) && ['武器防御', num(f.parry)],
          num(f.magical_skill_boost) && ['魔法增幅', num(f.magical_skill_boost)],
          num(f.magical_hit_accuracy) && ['魔法命中', num(f.magical_hit_accuracy)],
          num(f.attack_range) && ['攻击距离', `${+num(f.attack_range).toFixed(1)} m`],
        ]);
      } else if (f.block !== undefined || f.damage_reduce !== undefined) {
        base = kv([
          ['格挡', num(f.block)], ['伤害减少', num(f.damage_reduce) + '%'],
          num(f.reduce_max) && ['减少上限', num(f.reduce_max)],
        ]);
      } else if (f.armor_type || f.physical_defend !== undefined) {
        base = kv([
          f.physical_defend !== undefined && ['物理防御', num(f.physical_defend)],
          f.magical_resist !== undefined && ['魔法抵抗', num(f.magical_resist)],
          num(f.dodge) && ['回避', num(f.dodge)],
        ]);
      }
      const bonus = kv(it.bonus.map((x) => [x.label, (/^-/.test(x.value) ? '' : '+') + x.value, 'aa-tip-bonus']));
      // usable classes: the eight leaf classes, 0 = cannot use, else the minimum level
      const cls = CLASSES8.map(([k, t]) => [t, num(f[k])]);
      const usable = cls.filter(([, lv]) => lv > 0);
      const classLine = !usable.length ? AA.t('无')
        : usable.length === cls.length && usable.every(([, lv]) => lv === usable[0][1]) ? AA.t('全部职业')
        : usable.map(([t, lv]) => AA.t(t) + (lv !== it.lv ? ` <span class="aa-tip-dim">${lv}</span>` : '')).join('、');
      const sockets = it.gear && (it.slots.base || it.slots.extra)
        ? `${it.slots.base}` + (it.slots.extra ? ` <span class="aa-tip-dim">(+${it.slots.extra} ${AA.t('额外')})</span>` : '') : '';
      const enchant = it.gear ? (it.maxEnchant ? '+' + it.maxEnchant : AA.t('不可强化')) : '';
      const rules = [
        [yes(f.can_exchange), '可交易'], [yes(f.can_sell_to_npc), '可出售给 NPC'],
        [yes(f.can_deposit_to_character_warehouse), '个人仓库'], [yes(f.can_deposit_to_account_warehouse), '账号仓库'],
        [yes(f.can_deposit_to_guild_warehouse), '军团仓库'],
      ].map(([on, t]) => `<span class="aa-tip-flag${on ? ' on' : ''}"><i class="mdi ${on ? 'mdi-check' : 'mdi-close'}"></i>${AA.t(t)}</span>`).join('');
      const tags = [
        yes(f.lore) && '唯一（只能持有一个）', yes(f.soul_bind) && '可灵魂刻印',
        yes(f.can_composite_weapon) && '可合成', yes(f.can_proc_enchant) && '可镶嵌神石',
        yes(f.can_dye) && '可染色',
        it.gear && f.cannot_changeskin !== undefined && !yes(f.cannot_changeskin) && '可变更外观',
        it.gear && yes(f.breakable) && '可分解', yes(f.cash_item) && '商城物品',
        yes(f.remove_when_logout) && '下线后消失', yes(f.no_loot_public) && '不能公共拾取',
      ].filter(Boolean).map((t) => `<span class="aa-tip-tag">${AA.t(t)}</span>`).join('');
      const prices = kv([
        num(f.price) && ['NPC 售价', `${AA.fmtNum(f.price)} ${AA.t('基纳')}`],
        num(f.abyss_point) && ['深渊点数', AA.fmtNum(f.abyss_point)],
        it.refs.abyssItem && ['深渊物品', `${refName(it.refs.abyssItem)} × ${AA.fmtNum(num(f.abyss_item_count))}`],
        it.refs.extraCurrency && ['额外货币', `${refName(it.refs.extraCurrency)} × ${AA.fmtNum(num(f.extra_currency_item_count))}`],
        it.refs.tradeIn && ['兑换物品', `${refName(it.refs.tradeIn)} × ${AA.fmtNum(num(f.trade_in_item_count))}`],
      ]);
      const skill = (s) => `<span class="aa-mono">${AA.esc(s)}</span>`;
      const use = kv([
        f.activation_skill && ['使用效果', skill(f.activation_skill) + (num(f.activation_level) > 1 ? ` Lv${num(f.activation_level)}` : '')],
        f.skill_to_learn && ['学习技能', skill(f.skill_to_learn)],
        f.gain_skill1 && ['获得技能', `${skill(f.gain_skill1)} Lv${num(f.gain_level1)}`
          + (f.gain_skill2 ? `、${skill(f.gain_skill2)} Lv${num(f.gain_level2)}` : '')],
        num(f.require_shard) && ['消耗烙印石', num(f.require_shard)],
        num(f.casting_delay) && ['施放时间', (num(f.casting_delay) / 1000) + ' s'],
        num(f.use_delay) && ['冷却时间', (num(f.use_delay) / 1000) + ' s'],
        f.activation_skill && num(f.activation_count) > 0 && ['使用次数', num(f.activation_count)],
        num(f.expire_time) && ['使用期限', minutes(num(f.expire_time))],
        num(f.cash_available_minute) && ['可用时间', minutes(num(f.cash_available_minute))],
      ]);
      const desc = it.desc ? (AA.lang === 'en' ? (it.desc.en || it.desc.zh) : (it.desc.zh || it.desc.en)) : '';
      return `<div class="aa-tip">
        <div class="aa-tip-head">
          ${iconBox(it.q, it.ic, true)}
          <div class="aa-tip-name">
            <div class="aa-quality-${AA.esc(it.q)} aa-tip-title-name" data-no-i18n>${AA.esc(nameOf(it))}</div>
            <div class="aa-tip-dim">${AA.esc(typeOf(it))}</div>
            <div class="aa-tip-dim aa-mono">${it.id} · ${AA.esc(it.k)}</div>
          </div>
        </div>
        ${sec('', kv([
          ['等级', it.lv], ['品质', `<span class="aa-quality-${AA.esc(it.q)}">${AA.t(q ? q[1] : it.q)}</span>`],
          ['种族', AA.t(RACE_NAME[it.race] ?? '')],
          f.gender_permitted && f.gender_permitted !== 'all' && ['性别', AA.t(GENDER[f.gender_permitted] ?? f.gender_permitted)],
          ['可用职业', classLine],
        ]))}
        ${sec('基本属性', grid(base))}
        ${sec('附加属性', grid(bonus))}
        ${sec('强化', kv([sockets && ['魔石孔', sockets], enchant && ['最高强化', enchant]]))}
        ${sec('使用', use)}
        ${desc ? `<div class="aa-tip-sec aa-tip-desc" data-no-i18n>${AA.esc(desc)}</div>` : ''}
        ${sec('价格', prices)}
        ${tags ? `<div class="aa-tip-sec">${tags}</div>` : ''}
        <div class="aa-tip-sec aa-tip-rules">${rules}</div>
      </div>`;
    }

    function itemRaw(it) {
      return `<div class="table-responsive"><table class="table table-sm aa-db-table aa-db-raw"><tbody>
        ${Object.entries(it.f).map(([k, v]) => `<tr><td class="aa-mono text-muted">${AA.esc(k)}</td><td class="aa-mono" data-no-i18n>${AA.esc(v)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="text-muted small mb-0">${AA.t('服务端 items.xml 里这件物品的全部字段，按文件中的顺序。')}</p>`;
    }

    document.getElementById('db-detail').addEventListener('click', async (e) => {
      if (pageKind !== 'item' || !ist.it) return;
      const t = e.target.closest('[data-itab]');
      if (t) { e.preventDefault(); ist.tab = t.dataset.itab; renderItemTab(); return; }
      const pg = e.target.closest('#ig-pager [data-page]');
      if (pg) {
        e.preventDefault();
        const n = +pg.dataset.page;
        if (n && !pg.parentElement.classList.contains('disabled')) { ist.gpage = n; renderItemTab(); }
        return;
      }
      const row = e.target.closest('[data-gopen]');
      if (row) {                              // open the group on the 掉落组 page, listed by its id
        gstate.open = +row.dataset.gopen;
        document.getElementById('g-q').value = row.dataset.gopen;
        location.hash = '#item/dropgroup';
        return;
      }
      if (e.target.closest('#it-copy')) {
        const input = document.getElementById('it-link');
        try { await navigator.clipboard.writeText(input.value); } catch { input.select(); document.execCommand('copy'); }
        AA.toast(AA.t('已复制：{0}', input.value));
      }
    });

    // ---- NPC: /api/db/npcs (server-side filter + paging), detail from /api/db/npcs/:id ----
    const GRADES = [['normal', '普通'], ['elite', '精英'], ['hero', '英雄'], ['legend', '传说']];
    const NPC_CAT = { light: '天族', dark: '魔族', monster: '怪物', chief: '头目', boss: '命名BOSS', instance: '副本' };
    const nstate = { cat: '', map: '', page: 1, grades: new Set(), regions: new Set(), sort: 'id', desc: false, seq: 0, selected: 0 };
    const gradeName = (g) => AA.t((GRADES.find(([k]) => k === g) || [, ''])[1]);
    const npcName = (n) => (AA.lang === 'en' ? (n.en || n.zh || n.k) : (n.zh || n.en || n.k));
    // titles are shown as <title>; some strings already carry the brackets
    const npcTitle = (n) => (n.t ? (AA.lang === 'en' ? (n.t[1] || n.t[0]) : (n.t[0] || n.t[1])) : '').replace(/^\s*<(.*)>\s*$/, '$1');
    const mapName = (m) => (AA.lang === 'en' ? m.en : m.zh);
    const NPC_EMPTY = `<div class="aa-db-detail-empty"><i class="mdi mdi-information-outline"></i><div>${AA.t('点击左侧列表中的 NPC 查看详情')}</div></div>`;

    document.getElementById('n-grade').innerHTML = `<label>${AA.t('级别')}</label>` + GRADES.map(([k, t]) =>
      `<label class="aa-db-q aa-npc-grade-${k}"><input type="checkbox" value="${k}"> ${AA.t(t)}</label>`).join('');

    function renderNpcHead() {
      const th = (key, label, width) => {
        const on = nstate.sort === key;
        const icon = on ? (nstate.desc ? 'mdi-arrow-down' : 'mdi-arrow-up') : 'mdi-swap-vertical';
        return `<th style="width:${width}px" class="aa-db-sort${on ? ' on' : ''}" data-sort="${key}">${label} <i class="mdi ${icon}"></i></th>`;
      };
      document.getElementById('n-head').innerHTML = `<tr>${th('id', 'ID', 100)}<th>${AA.t('名称')}</th>
        ${th('lv', AA.t('等级'), 80)}<th style="width:70px">${AA.t('级别')}</th><th>${AA.t('出现地图')}</th></tr>`;
    }
    renderNpcHead();

    async function loadNpcs() {
      const q = new URLSearchParams({ cat: nstate.cat, page: nstate.page, size: val('n-size'), sort: nstate.sort, dir: nstate.desc ? 'desc' : 'asc' });
      if (nstate.map) q.set('map', nstate.map);
      if (val('n-lv-min')) q.set('lvMin', val('n-lv-min'));
      if (val('n-lv-max')) q.set('lvMax', val('n-lv-max'));
      if (nstate.grades.size) q.set('grade', [...nstate.grades].join(','));
      if (nstate.regions.size && nstate.cat !== 'instance') q.set('region', [...nstate.regions].join(','));
      if (val('n-q')) q.set('search', val('n-q'));
      const seq = ++nstate.seq, body = document.getElementById('n-body');
      let d;
      try { d = await AA.api('GET', '/api/db/npcs?' + q); } catch (e) {
        if (seq === nstate.seq) body.innerHTML = `<tr><td colspan="5" class="text-danger text-center py-4">${AA.esc(e.message)}</td></tr>`;
        return;
      }
      if (seq !== nstate.seq) return;
      nstate.page = d.page;
      // 副本 lists don't split bosses from mobs; only the factions' NPCs are marked
      const inInst = nstate.cat === 'instance';
      body.innerHTML = d.rows.map((n) => {
        const title = npcTitle(n);
        // versions of one instance share a name: show it once
        const where = n.maps ? [...new Set(n.maps.map(mapName))].map(AA.esc).join('、') + (n.more ? ` <span class="text-muted">+${n.more}</span>` : '')
          : `<span class="text-muted">${AA.t(n.ai ? '由其他 NPC 召唤' : '无刷新点')}</span>`;
        return `<tr data-nid="${n.id}" class="aa-db-row${n.id === nstate.selected ? ' table-active' : ''}">
          <td class="aa-mono">${n.id}</td>
          <td data-no-i18n><span class="${npcCls(n)}">${AA.esc(npcName(n))}</span>
            ${(!nstate.cat && n.c) || (inInst && FACTION.includes(n.c)) ? `<span class="aa-npc-cat">${AA.t(NPC_CAT[n.c])}</span>` : ''}
            ${title ? `<div class="text-muted small">&lt;${AA.esc(title)}&gt;</div>` : ''}</td>
          <td>${n.lv}</td><td>${gradeName(n.grade)}</td><td class="small" data-no-i18n>${where}</td>
        </tr>`;
      }).join('') || `<tr><td colspan="5" class="text-muted text-center py-4">${AA.t('没有符合条件的 NPC')}</td></tr>`;
      const from = d.total ? (d.page - 1) * d.size + 1 : 0, to = Math.min(d.total, d.page * d.size);
      document.getElementById('n-summary').textContent = AA.t('第 {0} 至 {1} 项，共 {2} 项', from, to, AA.fmtNum(d.total));
      renderPager(d.page, d.pages, 'n-pager');
    }

    let ntimer = 0;
    const nreload = (delay = 0) => { nstate.page = 1; clearTimeout(ntimer); ntimer = setTimeout(loadNpcs, delay); };
    // 地区: field maps from the NPC data, one row per side; instances have their own submenu, so 副本 hides it
    const SIDES = [['light', '天界'], ['dark', '魔界'], ['other', '其他']];
    AA.api('GET', '/api/db/npcs/regions').then((list) => {
      document.getElementById('n-region').innerHTML = `<label>${AA.t('地区')}</label><div class="aa-db-rgroups">${SIDES.map(([s, t]) => {
        const maps = list.filter((r) => r.side === s);
        return maps.length ? `<div><span class="aa-db-rside">${AA.t(t)}</span>${maps.map((r) =>
          `<label class="aa-db-q" data-no-i18n><input type="checkbox" value="${AA.esc(r.w)}"${nstate.regions.has(r.w) ? ' checked' : ''}> ${AA.esc(AA.lang === 'en' ? r.en : r.zh)}</label>`).join('')}</div>` : '';
      }).join('')}</div>`;
    }).catch(() => {});
    document.getElementById('n-region').addEventListener('change', (e) => { toggle(nstate.regions, e.target.value); nreload(); });

    const FACTION = ['light', 'dark'];
    // monsters are coloured by grade (普通 grey, 精英 green, 英雄 blue, 传说 gold); the factions' NPCs by side
    const npcCls = (n) => (FACTION.includes(n.c) ? 'aa-npc-' + n.c : n.c ? 'aa-grade-' + (n.grade || 'normal') : 'aa-npc-other');
    function renderNpcs(cat, map) {
      document.getElementById('n-region').classList.toggle('d-none', cat === 'instance');
      if (cat !== nstate.cat || map !== nstate.map) {
        nstate.cat = cat; nstate.map = map; nstate.selected = 0;
        document.getElementById('db-detail').innerHTML = NPC_EMPTY;
      }
      nreload();
    }

    // 副本 submenu entries come from the NPC data (instances with their typical level)
    AA.api('GET', '/api/db/npcs/instances').then((list) => {
      const node = TREE.find((n) => n[0] === 'npc')[2].find((n) => n[0] === 'instance');
      node[2] = list.map((i) => [i.key, `${AA.lang === 'en' ? i.en : i.zh} · Lv${i.lv}`]);
      buildMenu();
      render();
    }).catch(() => {});
    document.getElementById('n-grade').addEventListener('change', (e) => { toggle(nstate.grades, e.target.value); nreload(); });
    ['n-lv-min', 'n-lv-max', 'n-q'].forEach((id) => document.getElementById(id).addEventListener('input', () => nreload(350)));
    document.getElementById('n-size').addEventListener('change', () => nreload());
    document.getElementById('n-reset').addEventListener('click', () => {
      ['n-lv-min', 'n-lv-max', 'n-q'].forEach((id) => { document.getElementById(id).value = ''; });
      document.querySelectorAll('#n-grade input, #n-region input').forEach((x) => { x.checked = false; });
      nstate.grades.clear(); nstate.regions.clear(); nreload();
    });
    document.getElementById('n-head').addEventListener('click', (e) => {
      const th = e.target.closest('[data-sort]'); if (!th) return;
      if (nstate.sort === th.dataset.sort) nstate.desc = !nstate.desc;
      else { nstate.sort = th.dataset.sort; nstate.desc = false; }
      renderNpcHead(); nreload();
    });
    document.getElementById('n-pager').addEventListener('click', (e) => {
      const a = e.target.closest('[data-page]'); if (!a) return;
      e.preventDefault();
      const n = +a.dataset.page;
      if (!n || a.parentElement.classList.contains('disabled') || a.parentElement.classList.contains('active')) return;
      nstate.page = n; loadNpcs();
    });
    document.getElementById('n-body').addEventListener('click', (e) => {
      const tr = e.target.closest('tr[data-nid]'); if (!tr) return;
      nstate.selected = +tr.dataset.nid;
      document.querySelectorAll('#n-body tr.table-active').forEach((x) => x.classList.remove('table-active'));
      tr.classList.add('table-active');
      showNpc(nstate.selected);
    });

    // basic NPC card (same dark tooltip style as items); drops, skills and spawn points come later
    let nseq = 0;
    async function showNpc(id) {
      const box = document.getElementById('db-detail'), seq = ++nseq;
      let n;
      try { n = await AA.api('GET', '/api/db/npcs/' + id); } catch (e) {
        if (seq === nseq) box.innerHTML = `<div class="text-danger">${AA.esc(e.message)}</div>`;
        return;
      }
      if (seq !== nseq || nstate.selected !== id || pageKind !== 'npc') return;
      nst.n = n;
      const title = npcTitle(n);
      const maps = [...new Set((n.maps || []).map((w) => (AA.lang === 'en' ? n.mapNames[w][1] : n.mapNames[w][0]) || w))];
      box.innerHTML = `<div class="aa-tip aa-tip-npc">
        <div class="aa-tip-name">
          <div class="aa-tip-title-name ${npcCls(n)}" data-no-i18n>${AA.esc(npcName(n))}</div>
          ${title ? `<div class="aa-tip-dim" data-no-i18n>&lt;${AA.esc(title)}&gt;</div>` : ''}
          <div class="aa-tip-dim aa-mono">${n.id} · ${AA.esc(n.k)}</div>
        </div>
        ${sec('', kv([
          ['分类', AA.t(NPC_CAT[n.c] || '其他')],
          ['等级', n.lv], ['级别', `${gradeName(n.grade)} <span class="aa-tip-dim">(${n.g})</span>`],
          ['生命力', AA.fmtNum(n.hp)],
          n.race && ['种族类型', `<span class="aa-mono">${AA.esc(n.race)}</span>`],
          n.tribe && ['阵营', `<span class="aa-mono">${AA.esc(n.tribe)}</span>`],
        ]))}
        ${sec('出现地图', maps.length ? `<div data-no-i18n>${maps.map(AA.esc).join('、')}</div>`
          : `<div class="aa-tip-dim">${AA.t(n.ai ? '由其他 NPC 的 AI 召唤' : '没有刷新点（可能由任务、事件或脚本生成）')}</div>`)}
      </div>
      <ul class="nav nav-tabs aa-db-tabs mt-4 mb-3">
        ${n.expect && n.expect.length ? `<li class="nav-item"><a class="nav-link" href="#" data-ntab="expect">${AA.t('期望获得')} <span class="badge bg-light text-dark">${n.expect.length}</span></a></li>` : ''}
        <li class="nav-item"><a class="nav-link" href="#" data-ntab="drops">${AA.t('掉落组')} <span class="badge bg-light text-dark">${n.drops.length + n.groups.filter((g) => g.adj > 0).length}</span></a></li>
        <li class="nav-item"><a class="nav-link" href="#" data-ntab="raw">${AA.t('原始数据')} <span class="badge bg-light text-dark">${n.f.length}</span></a></li>
      </ul>
      <div id="nt-body"></div>`;
      renderNpcTab();
    }

    // tabs under the NPC card; the chosen tab is kept while browsing NPCs
    // 期望获得 opens first on bosses; NPCs without it fall back to 掉落组
    const nst = { n: null, tab: 'expect' };
    function renderNpcTab() {
      const n = nst.n; if (!n) return;
      const tab = nst.tab === 'expect' && !(n.expect && n.expect.length) ? 'drops' : nst.tab;
      document.querySelectorAll('#db-detail [data-ntab]').forEach((a) => a.classList.toggle('active', a.dataset.ntab === tab));
      document.getElementById('nt-body').innerHTML = tab === 'raw' ? npcRaw(n) : tab === 'expect' ? npcExpect(n) : npcDrops(n);
    }

    // 期望获得: the boss's own drops (its exclusive groups' items + equipment nobody else drops), chance per kill
    function npcExpect(n) {
      const sum = n.expect.reduce((s, it) => s + it.chance, 0) / 1e7;
      const src = (it) => it.from.map((s) => (s ? `<span class="aa-mono${it.own ? '' : ' text-muted'}">${AA.esc(s)}</span>` : AA.t('直接掉落'))).join('<br>')
        || `<span class="text-muted">${AA.t('当前不掉落')}</span>`;
      const kills = (c) => (c > 0 ? AA.t('约 {0} 只', AA.fmtNum(Math.max(1, Math.round(1e7 / c)))) : '-');
      return `<p class="mb-2">${AA.t('每击杀一次，平均获得 {0} 件下列物品。', sum.toFixed(2))}</p>
        <div class="table-responsive"><table class="table table-sm aa-db-table">
          <thead><tr><th style="width:52px"></th><th>${AA.t('物品')}</th><th style="width:50px">${AA.t('等级')}</th><th>${AA.t('来源')}</th>
            <th style="width:86px" title="${AA.t('掉落系数 100 时，击杀一次得到这件的概率（合并所有来源）')}">${AA.t('概率')}</th>
            <th style="width:86px" title="${AA.t('平均要击杀多少次才能得到一件')}">${AA.t('平均击杀')}</th></tr></thead>
          <tbody>${n.expect.map((it) => `<tr>
            <td>${iconBox(it.q, it.ic)}</td>
            <td data-no-i18n class="text-nowrap"><span class="aa-quality-${AA.esc(it.q)}">${AA.esc(it.id ? nameOf(it) : it.k)}</span><div class="text-muted small aa-mono">${it.id || AA.esc(it.k)}</div></td>
            <td>${it.lv || ''}</td><td class="small" data-no-i18n>${src(it)}</td>
            <td class="aa-mono">${it.chance > 0 ? pct(it.chance) : '-'}</td><td>${kills(it.chance)}</td></tr>`).join('')}</tbody>
        </table></div>
        <p class="text-muted small mb-0">${AA.t('只属于这个 BOSS 的掉落：它独占的掉落组里的全部物品，加上别的怪都不掉的装备。概率按掉落系数 100 计算，合并了直接掉落和所有引用的组；灰色的来源是和别的怪共用的组。')}</p>`;
    }

    function npcDrops(n) {
      const [cmin, cmax, cprob] = n.cash;
      const cash = cprob > 0 && cmax > 0
        ? `<p class="mb-3">${AA.t('基纳')}：<b>${AA.fmtNum(cmin)} ~ ${AA.fmtNum(cmax)}</b> <span class="text-muted">（${AA.t('概率')} ${pct(Math.min(cprob, 1e7))}）</span></p>` : '';
      const direct = n.drops.length ? `
        <h6 class="mb-2">${AA.t('直接掉落')} <span class="text-muted small">${AA.t('每件各自掷一次')}</span></h6>
        <div class="table-responsive mb-3"><table class="table table-sm aa-db-table">
          <thead><tr><th style="width:52px"></th><th>${AA.t('物品')}</th><th style="width:50px">${AA.t('等级')}</th>
            <th style="width:60px">${AA.t('数量')}</th><th style="width:86px">${AA.t('概率')}</th></tr></thead>
          <tbody>${n.drops.map((it) => `<tr>
            <td>${iconBox(it.q, it.ic)}</td>
            <td data-no-i18n class="text-nowrap"><span class="aa-quality-${AA.esc(it.q)}">${AA.esc(it.id ? nameOf(it) : it.k)}</span><div class="text-muted small aa-mono">${it.id || AA.esc(it.k)}</div></td>
            <td>${it.lv || ''}</td><td>${it.count}</td><td class="aa-mono">${pct(it.chance)}</td></tr>`).join('')}</tbody>
        </table></div>` : '';
      const groups = n.groups.length ? `
        <h6 class="mb-2">${AA.t('掉落组')} <span class="text-muted small">${AA.t('每组掷一次，最多出组里的一件；点一行打开这个组')}</span></h6>
        <div class="table-responsive"><table class="table table-sm aa-db-table">
          <thead><tr><th style="width:70px">ID</th><th>${AA.t('掉落组')}</th><th style="width:60px">${AA.t('物品数')}</th>
            <th style="width:76px" title="${AA.t('npcs.xml 的 common_drop_adjustment，100 = 原值')}">${AA.t('掉落系数')}</th>
            <th style="width:86px" title="${AA.t('击杀一次，这个组出一件的概率')}">${AA.t('本组概率')}</th></tr></thead>
          <tbody>${n.groups.map((g) => `<tr class="${g.id ? 'aa-db-row' : ''}${g.adj > 0 ? '' : ' text-muted'}"${g.id ? ` data-gopen="${g.id}"` : ''}>
            <td class="aa-mono">${g.id || ''}</td><td class="aa-mono" data-no-i18n>${AA.esc(g.name)}</td><td>${g.items}</td>
            <td class="aa-mono">${g.adj}</td><td class="aa-mono">${g.adj > 0 ? pct(g.chance) : AA.t('不掉落')}</td></tr>`).join('')}</tbody>
        </table></div>` : '';
      return cash + direct + groups || `<p class="text-muted">${AA.t('这个 NPC 没有掉落。')}</p>`;
    }

    function npcRaw(n) {
      return `<div class="table-responsive"><table class="table table-sm aa-db-table aa-db-raw"><tbody>
        ${n.f.map(([k, v]) => `<tr><td class="aa-mono text-muted">${AA.esc(k)}</td><td class="aa-mono" data-no-i18n>${AA.esc(v)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="text-muted small mb-0">${AA.t('服务端 npcs.xml 里这个 NPC 的全部字段，按文件中的顺序；data[n] 是列表里的第 n 项。')}</p>`;
    }

    document.getElementById('db-detail').addEventListener('click', (e) => {
      if (pageKind !== 'npc' || !nst.n) return;
      const t = e.target.closest('[data-ntab]');
      if (t) { e.preventDefault(); nst.tab = t.dataset.ntab; renderNpcTab(); return; }
      const row = e.target.closest('[data-gopen]');
      if (row) {                              // open the group on the 掉落组 page, listed by its id
        gstate.open = +row.dataset.gopen;
        document.getElementById('g-q').value = row.dataset.gopen;
        location.hash = '#item/dropgroup';
      }
    });

    // ---- 掉落组 ----
    const gstate = { page: 1, sort: 'id', desc: false, seq: 0, selected: 0, active: false, open: 0 };
    const DETAIL_EMPTY = document.getElementById('db-detail').innerHTML;
    const pct = (w) => {                       // weight is per roll in 1/10,000,000
      const v = w / 1e5;
      return (v >= 1 ? v.toFixed(2) : v >= 0.01 ? v.toFixed(3) : v.toFixed(4)).replace(/\.?0+$/, '') + '%';
    };

    function renderGroupHead() {
      const th = (key, label, width) => {
        const on = gstate.sort === key;
        const icon = on ? (gstate.desc ? 'mdi-arrow-down' : 'mdi-arrow-up') : 'mdi-swap-vertical';
        return `<th style="width:${width}px" class="aa-db-sort${on ? ' on' : ''}" data-sort="${key}">${label} <i class="mdi ${icon}"></i></th>`;
      };
      document.getElementById('g-head').innerHTML = `<tr>${th('id', 'ID', 80)}<th>${AA.t('组名')}</th>
        ${th('items', AA.t('物品数'), 90)}${th('users', AA.t('引用怪数'), 100)}</tr>`;
    }
    renderGroupHead();

    async function loadGroups() {
      const q = new URLSearchParams({ page: gstate.page, size: val('g-size'), sort: gstate.sort, dir: gstate.desc ? 'desc' : 'asc' });
      if (val('g-q')) q.set('search', val('g-q'));
      const seq = ++gstate.seq, body = document.getElementById('g-body');
      let d;
      try { d = await AA.api('GET', '/api/db/dropgroups?' + q); } catch (e) {
        if (seq === gstate.seq) body.innerHTML = `<tr><td colspan="4" class="text-danger text-center py-4">${AA.esc(e.message)}</td></tr>`;
        return;
      }
      if (seq !== gstate.seq) return;
      gstate.page = d.page;
      body.innerHTML = d.rows.map((g) => `
        <tr data-gid="${g.id}" class="aa-db-row${g.id === gstate.selected ? ' table-active' : ''}">
          <td class="aa-mono">${g.id}</td><td class="aa-mono small" data-no-i18n>${AA.esc(g.name)}</td>
          <td>${g.items}</td><td>${g.users ? AA.fmtNum(g.users) : `<span class="text-muted">0</span>`}</td>
        </tr>`).join('') || `<tr><td colspan="4" class="text-muted text-center py-4">${AA.t('没有符合条件的掉落组')}</td></tr>`;
      const from = d.total ? (d.page - 1) * d.size + 1 : 0, to = Math.min(d.total, d.page * d.size);
      document.getElementById('g-summary').textContent = AA.t('第 {0} 至 {1} 项，共 {2} 项', from, to, AA.fmtNum(d.total));
      renderPager(d.page, d.pages, 'g-pager');
    }
    let gtimer = 0;
    const reloadGroups = (delay = 0) => { gstate.page = 1; clearTimeout(gtimer); gtimer = setTimeout(loadGroups, delay); };

    // detail card: two tabs, each filtered and paged on the client (a group has at most a few thousand NPCs)
    const gd = { g: null, tab: 'items', q: { items: '', npcs: '' }, page: { items: 1, npcs: 1 }, size: { items: 10, npcs: 10 } };

    async function showGroup(id) {
      const box = document.getElementById('db-detail');
      let g;
      try { g = await AA.api('GET', '/api/db/dropgroups/' + id); } catch (e) {
        box.innerHTML = `<div class="text-danger">${AA.esc(e.message)}</div>`; return;
      }
      if (!gstate.active || gstate.selected !== id) return;
      Object.assign(gd, { g, page: { items: 1, npcs: 1 }, q: { items: '', npcs: '' } });
      box.innerHTML = `
        <h4 class="mb-1 aa-mono" data-no-i18n>${AA.esc(g.name)}</h4>
        <p class="text-muted small mb-3">ID ${g.id} · ${AA.t('组合计 {0}', pct(g.total))}</p>
        <ul class="nav nav-tabs aa-db-tabs mb-3">
          <li class="nav-item"><a class="nav-link" href="#" data-tab="items">${AA.t('物品内容')} <span class="badge bg-light text-dark">${g.items.length}</span></a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-tab="npcs">${AA.t('引用 NPC')} <span class="badge bg-light text-dark">${AA.fmtNum(g.npcs.length)}</span></a></li>
        </ul>
        <div class="aa-db-bar">
          <div class="d-flex align-items-center gap-2">
            <span>${AA.t('显示')}</span>
            <select class="form-control form-control-sm" id="gd-size" style="width:auto"><option>10</option><option>20</option></select>
            <span>${AA.t('项结果')}</span>
          </div>
          <div class="d-flex align-items-center gap-2">
            <span>${AA.t('搜索：')}</span>
            <input type="text" class="form-control form-control-sm" id="gd-q" style="width:180px">
          </div>
        </div>
        <div class="aa-db-bar">
          <span class="text-muted" id="gd-summary"></span>
          <nav><ul class="pagination pagination-sm mb-0" id="gd-pager"></ul></nav>
        </div>
        <div class="table-responsive"><table class="table table-sm aa-db-table"><thead id="gd-head"></thead><tbody id="gd-body"></tbody></table></div>
        <p class="text-muted small mb-0" id="gd-note"></p>`;
      renderGroupTab();
    }

    function renderGroupTab() {
      const g = gd.g, tab = gd.tab;
      if (!g) return;
      document.querySelectorAll('#db-detail [data-tab]').forEach((a) => a.classList.toggle('active', a.dataset.tab === tab));
      const qIn = document.getElementById('gd-q'), sizeIn = document.getElementById('gd-size');
      qIn.placeholder = tab === 'items' ? AA.t('物品名称或 ID') : AA.t('NPC 名称或 ID');
      qIn.value = gd.q[tab];
      sizeIn.value = String(gd.size[tab]);
      const s = gd.q[tab].trim().toLowerCase();
      const match = (x) => !s || String(x.id) === s || String(x.id).startsWith(s) || [x.zh, x.en, x.k].some((v) => (v || '').toLowerCase().includes(s));
      const all = tab === 'items' ? g.items : g.npcs;
      const rows = all.filter(match);
      const size = gd.size[tab], pages = Math.max(1, Math.ceil(rows.length / size));
      const page = gd.page[tab] = Math.min(Math.max(gd.page[tab], 1), pages);
      const view = rows.slice((page - 1) * size, page * size);
      // highlight items found by the group-list search on the left
      const ls = val('g-q').toLowerCase();
      const hit = (it) => ls && (String(it.id) === ls || [it.zh, it.en, it.k].some((x) => (x || '').toLowerCase().includes(ls)));
      if (tab === 'items') {
        document.getElementById('gd-head').innerHTML = `<tr><th style="width:52px"></th><th>${AA.t('物品')}</th><th style="width:50px">${AA.t('等级')}</th>
          <th style="width:86px" title="${AA.t('掉落系数 100 时，每掷一次出这件的概率')}">${AA.t('每次概率')}</th><th style="width:76px">${AA.t('组内占比')}</th></tr>`;
        document.getElementById('gd-body').innerHTML = view.map((it) => `
          <tr class="${hit(it) ? 'table-warning' : ''}">
            <td><span class="aa-db-icon aa-db-icon-${AA.esc(it.q)}">${it.ic ? `<img src="icons/item/${encodeURIComponent(it.ic)}.png" alt="" loading="lazy" onerror="this.remove()">` : ''}</span></td>
            <td data-no-i18n class="text-nowrap"><span class="aa-quality-${AA.esc(it.q)}">${AA.esc(nameOf(it))}</span><div class="text-muted small aa-mono">${it.id || ''}</div></td>
            <td>${it.lv || ''}</td><td class="aa-mono">${pct(it.weight)}</td>
            <td class="aa-mono">${g.total ? (it.weight / g.total * 100).toFixed(1) + '%' : ''}</td>
          </tr>`).join('') || `<tr><td colspan="5" class="text-muted text-center py-3">${AA.t('没有符合条件的物品')}</td></tr>`;
        document.getElementById('gd-note').textContent = AA.t('每次概率按掉落系数 100 计算；引用这个组的怪物会再乘上自己的掉落系数 / 100。')
          + (g.total > 1e7 ? ' ' + AA.t('这个组合计超过 100%，只配合小于 100 的掉落系数使用；系数过大时，CommonDropItems.xml 里排在后面的物品会被挤掉（表格按概率排序，不是文件顺序）。') : '');
      } else {
        document.getElementById('gd-head').innerHTML = `<tr><th style="width:90px">ID</th><th>${AA.t('NPC')}</th><th style="width:50px">${AA.t('等级')}</th>
          <th style="width:86px" title="${AA.t('npcs.xml 的 common_drop_adjustment，100 = 原值')}">${AA.t('掉落系数')}</th>
          <th style="width:96px" title="${AA.t('击杀一次，这个组出一件的概率')}">${AA.t('本组概率')}</th></tr>`;
        document.getElementById('gd-body').innerHTML = view.map((n) => `
          <tr><td class="aa-mono">${n.id}</td>
            <td data-no-i18n class="text-nowrap">${AA.esc(AA.lang === 'en' ? (n.en || n.k) : (n.zh || n.k))}<div class="text-muted small aa-mono">${AA.esc(n.k)}</div></td>
            <td>${n.lv || ''}</td><td class="aa-mono">${n.adj}</td><td class="aa-mono">${pct(n.chance)}</td></tr>`).join('')
          || `<tr><td colspan="5" class="text-muted text-center py-3">${all.length ? AA.t('没有符合条件的 NPC') : AA.t('没有 NPC 引用这个组')}</td></tr>`;
        document.getElementById('gd-note').textContent = AA.t('本组概率 = 组合计 × 掉落系数 / 100（最高 100%），是击杀一次这个组出一件的概率。');
      }
      const from = rows.length ? (page - 1) * size + 1 : 0, to = Math.min(rows.length, page * size);
      document.getElementById('gd-summary').textContent = AA.t('第 {0} 至 {1} 项，共 {2} 项', from, to, AA.fmtNum(rows.length));
      renderPager(page, pages, 'gd-pager');
    }

    // detail card events (the card's content is replaced, so listen on the card itself)
    const detail = document.getElementById('db-detail');
    detail.addEventListener('click', (e) => {
      if (!gstate.active || !gd.g) return;
      const t = e.target.closest('[data-tab]');
      if (t) { e.preventDefault(); gd.tab = t.dataset.tab; renderGroupTab(); return; }
      const a = e.target.closest('#gd-pager [data-page]');
      if (a) {
        e.preventDefault();
        const n = +a.dataset.page;
        if (!n || a.parentElement.classList.contains('disabled') || a.parentElement.classList.contains('active')) return;
        gd.page[gd.tab] = n; renderGroupTab();
      }
    });
    let gdtimer = 0;
    detail.addEventListener('input', (e) => {
      if (e.target.id !== 'gd-q') return;
      gd.q[gd.tab] = e.target.value; gd.page[gd.tab] = 1;
      clearTimeout(gdtimer); gdtimer = setTimeout(() => {
        renderGroupTab();
        const q = document.getElementById('gd-q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length);
      }, 250);
    });
    detail.addEventListener('change', (e) => {
      if (e.target.id !== 'gd-size') return;
      gd.size[gd.tab] = +e.target.value; gd.page[gd.tab] = 1; renderGroupTab();
    });

    document.getElementById('g-head').addEventListener('click', (e) => {
      const th = e.target.closest('[data-sort]'); if (!th) return;
      if (gstate.sort === th.dataset.sort) gstate.desc = !gstate.desc;
      else { gstate.sort = th.dataset.sort; gstate.desc = th.dataset.sort !== 'id'; }   // counts: biggest first
      renderGroupHead(); reloadGroups();
    });
    document.getElementById('g-q').addEventListener('input', () => reloadGroups(350));
    document.getElementById('g-size').addEventListener('change', () => reloadGroups());
    document.getElementById('g-pager').addEventListener('click', (e) => {
      const a = e.target.closest('[data-page]'); if (!a) return;
      e.preventDefault();
      const n = +a.dataset.page;
      if (!n || a.parentElement.classList.contains('disabled') || a.parentElement.classList.contains('active')) return;
      gstate.page = n; loadGroups();
    });
    document.getElementById('g-body').addEventListener('click', (e) => {
      const tr = e.target.closest('tr[data-gid]'); if (!tr) return;
      gstate.selected = +tr.dataset.gid;
      document.querySelectorAll('#g-body tr.table-active').forEach((x) => x.classList.remove('table-active'));
      tr.classList.add('table-active');
      showGroup(gstate.selected);
    });

    function render() {
      const route = decodeURIComponent(location.hash.slice(1)) || 'item';
      const path = resolve(route);
      document.querySelectorAll('.aa-dbmenu-top').forEach((li) => li.classList.toggle('active', path[0] && li.dataset.top === path[0][0]));
      let acc = '';
      document.getElementById('crumb').innerHTML = path.map(([k, title], i) => {
        acc += (acc ? '/' : '') + k;
        return i === path.length - 1
          ? `<li class="breadcrumb-item active">${AA.esc(AA.t(title))}</li>`
          : `<li class="breadcrumb-item"><a href="#${acc}">${AA.esc(AA.t(title))}</a></li>`;
      }).join('');
      // 掉落组 lives under 物品 in the menu but is its own page, not an item list
      const isGroups = path[0] && path[0][0] === 'item' && path[1] && path[1][0] === 'dropgroup';
      const isItem = path[0] && path[0][0] === 'item' && !isGroups;
      const isNpc = path[0] && path[0][0] === 'npc';
      document.getElementById('db-items').classList.toggle('d-none', !isItem);
      document.getElementById('db-groups').classList.toggle('d-none', !isGroups);
      document.getElementById('db-npcs').classList.toggle('d-none', !isNpc);
      document.getElementById('db-empty').classList.toggle('d-none', isItem || isGroups || isNpc);
      const kind = isGroups ? 'groups' : isNpc ? 'npc' : isItem ? 'item' : 'other';
      if (kind !== pageKind) {                   // switching page kinds resets the detail card
        pageKind = kind; gstate.active = isGroups;
        document.getElementById('db-detail').innerHTML = isGroups
          ? `<div class="aa-db-detail-empty"><i class="mdi mdi-information-outline"></i><div>${AA.t('点击左侧列表中的掉落组查看组内物品')}</div></div>`
          : isNpc ? NPC_EMPTY : DETAIL_EMPTY;
        if (isGroups) {
          gstate.selected = gstate.open; gstate.open = 0;     // opened from an item's 掉落组 tab
          loadGroups();
          if (gstate.selected) showGroup(gstate.selected);
        } else if (isNpc) {
          if (nstate.selected) showNpc(nstate.selected);
        } else if (isItem && state.selected) showItem(state.selected);  // back from another page: show the selected item again
      }
      if (isNpc) renderNpcs(path[1] ? path[1][0] : '', path[1] && path[1][0] === 'instance' && path[2] ? path[2][0] : '');
      if (isItem) {
        renderItems(path.map((n) => n[0]).join('/'));
        showStats(!NON_GEAR.includes(path[1] && path[1][0]));
      }
    }
    // 技能相关 / 制作 / 消耗品 are ordinary items, not gear: no 附加属性 filter there
    const NON_GEAR = ['skillrelated', 'making', 'consumable'];
    const showStats = (on) => ['f-stats-toggle', 'f-stats'].forEach((id) => { document.getElementById(id).style.display = on ? '' : 'none'; });
    let pageKind = 'item';                     // what the detail card currently belongs to
    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>

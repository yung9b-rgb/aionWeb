<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>公告 · 永恒之塔 GM</title>
  <link rel="stylesheet" href="vendors/mdi/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="vendors/base/vendor.bundle.base.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="shortcut icon" href="images/favicon.png" />
</head>
<body>
  <div class="container-scroller">
    <div id="aa-navbar"></div>
    <div class="container-fluid page-body-wrapper">
      <div id="aa-sidebar"></div>
      <div class="main-panel">
        <div class="content-wrapper">
          <div class="row">
            <div class="col-md-12 grid-margin">
              <h2>公告</h2>
              <p class="text-muted mb-0">直接发给 CacheD 管理端口，实时广播到游戏内，不需要 GMServer。</p>
            </div>
          </div>
          <div class="row">
            <div class="col-lg-7 grid-margin stretch-card">
              <div class="card">
                <div class="card-body">
                  <form id="form">
                    <div class="form-group">
                      <label for="text">公告内容 <small class="text-muted">（<span id="count">0</span>/255）</small></label>
                      <textarea class="form-control" id="text" rows="4" maxlength="255" placeholder="例如：服务器将在 10 分钟后重启维护"></textarea>
                    </div>
                    <div class="row">
                      <div class="col-sm-6 form-group">
                        <label>显示位置</label>
                        <select class="form-control" id="position">
                          <option value="M">屏幕中央（醒目）</option>
                          <option value="C">聊天窗口</option>
                        </select>
                      </div>
                      <div class="col-sm-6 form-group">
                        <label>公告类别</label>
                        <select class="form-control" id="category">
                          <option value="A">普通公告</option>
                          <option value="E">活动公告</option>
                        </select>
                      </div>
                    </div>
                    <div class="form-group">
                      <label>接收种族</label>
                      <div class="aa-check-grid" id="races">
                        <div class="form-check"><label class="form-check-label"><input type="checkbox" class="form-check-input" value="0" checked> 天族</label></div>
                        <div class="form-check"><label class="form-check-label"><input type="checkbox" class="form-check-input" value="1" checked> 魔族</label></div>
                      </div>
                    </div>
                    <div class="form-group">
                      <label>接收职业 <a href="#" id="all-classes" class="ms-2 small">全选</a> <a href="#" id="no-classes" class="ms-1 small">全不选</a></label>
                      <div class="aa-check-grid" id="classes">
                        <div class="form-check"><label class="form-check-label"><input type="checkbox" class="form-check-input" value="0" checked> 战士</label></div>
                        <div class="form-check"><label class="form-check-label"><input type="checkbox" class="form-check-input" value="1" checked> 剑星</label></div>
                        <div class="form-check"><label class="form-check-label"><input type="checkbox" class="form-check-input" value="2" checked> 守护星</label></div>
                        <div class="form-check"><label class="form-check-label"><input type="checkbox" class="form-check-input" value="3" checked> 侦察者</label></div>
                        <div class="form-check"><label class="form-check-label"><input type="checkbox" class="form-check-input" value="4" checked> 杀星</label></div>
                        <div class="form-check"><label class="form-check-label"><input type="checkbox" class="form-check-input" value="5" checked> 弓星</label></div>
                        <div class="form-check"><label class="form-check-label"><input type="checkbox" class="form-check-input" value="6" checked> 法师</label></div>
                        <div class="form-check"><label class="form-check-label"><input type="checkbox" class="form-check-input" value="7" checked> 魔道星</label></div>
                        <div class="form-check"><label class="form-check-label"><input type="checkbox" class="form-check-input" value="8" checked> 精灵星</label></div>
                        <div class="form-check"><label class="form-check-label"><input type="checkbox" class="form-check-input" value="9" checked> 祭司</label></div>
                        <div class="form-check"><label class="form-check-label"><input type="checkbox" class="form-check-input" value="10" checked> 治愈星</label></div>
                        <div class="form-check"><label class="form-check-label"><input type="checkbox" class="form-check-input" value="11" checked> 护法星</label></div>
                      </div>
                    </div>
                    <button type="submit" class="btn btn-primary me-2" id="send"><i class="mdi mdi-send"></i> 立即广播</button>
                  </form>
                </div>
              </div>
            </div>
            <div class="col-lg-5 grid-margin stretch-card">
              <div class="card">
                <div class="card-body">
                  <p class="card-title">本次发送记录</p>
                  <ul class="list-unstyled mb-0" id="history"><li class="text-muted">还没有发送过公告</li></ul>
                  <hr>
                  <p class="text-muted small mb-0">
                    说明：种族、职业是按位筛选的。全选时所有在线玩家都能收到；
                    全部不选等于谁都收不到，所以至少要选一个。
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div id="aa-footer"></div>
      </div>
    </div>
  </div>
  <script src="vendors/base/vendor.bundle.base.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/off-canvas.js"></script>
  <script src="js/hoverable-collapse.js"></script>
  <script src="js/template.js"></script>
  <script>
    const text = document.getElementById('text');
    text.addEventListener('input', () => { document.getElementById('count').textContent = text.value.length; });
    const setAll = (v) => document.querySelectorAll('#classes input').forEach((c) => { c.checked = v; });
    document.getElementById('all-classes').addEventListener('click', (e) => { e.preventDefault(); setAll(true); });
    document.getElementById('no-classes').addEventListener('click', (e) => { e.preventDefault(); setAll(false); });

    function mask(sel, total) {
      const vals = [...document.querySelectorAll(sel + ' input:checked')].map((c) => Number(c.value));
      if (vals.length === total) return -1;
      return vals.reduce((m, v) => m | (1 << v), 0);
    }

    const history = [];
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        text: text.value,
        position: document.getElementById('position').value,
        category: document.getElementById('category').value,
        raceMask: mask('#races', 2),
        classMask: mask('#classes', 12),
      };
      const btn = document.getElementById('send');
      btn.disabled = true;
      try {
        await AA.api('POST', '/api/announce', body);
        AA.toast(AA.t('公告已广播'));
        history.unshift({ t: new Date(), ...body });
        document.getElementById('history').innerHTML = history.slice(0, 20).map((h) =>
          `<li class="mb-2"><span class="text-muted">${AA.fmtTime(h.t).slice(11)}</span>
           <span class="badge bg-${h.position === 'M' ? 'primary' : 'secondary'}">${AA.t(h.position === 'M' ? '屏幕中央' : '聊天窗口')}</span>
           <span data-no-i18n>${AA.esc(h.text)}</span></li>`).join('');
      } catch (ex) {
        AA.toast(AA.t('发送失败：{0}', ex.message), 'danger');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
